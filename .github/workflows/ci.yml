name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The web bundle must build (types alone don't catch Vite/Tailwind errors).
      - run: pnpm --filter @grimo/web build
        env:
          VITE_CONVEX_URL: https://ci.convex.cloud
      # Native config and dependency versions must match the Expo SDK.
      - run: npx expo-doctor
        working-directory: apps/mobile
