packages:
  - apps/*
  - packages/*

# React Native/Metro behaves best with a flat node_modules.
nodeLinker: hoisted

# Single source of truth for versions shared across apps/packages.
# Use "catalog:" as the version in any package.json.
catalog:
  "@better-auth/expo": ^1.7.10
  "@cloudflare/workers-types": ~5.20261016.1
  "@hono/zod-validator": ^0.9.1
  "@tanstack/query-async-storage-persister": ^5.104.4
  "@tanstack/react-query": ^5.104.4
  "@tanstack/react-query-persist-client": ^5.104.4
  "@types/react": ~19.2.2
  "@types/react-dom": ~19.2.2
  better-auth: ^1.7.10
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  hono: ^4.13.13
  react: 19.2.3
  react-dom: 19.2.3
  typescript: ~6.0.3
  vitest: ^5.0.5
  wrangler: ^4.151.1
  zod: ^4.6.7
  zustand: ^5.0.15

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# Keep a single copy of shared peer deps across the workspace.
overrides:
  "@cloudflare/workers-types": "catalog:"
