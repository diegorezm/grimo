packages:
  - apps/*
  - packages/*

# React Native/Metro behaves best with a flat node_modules.
nodeLinker: hoisted

# Single source of truth for versions shared across apps/packages.
# Use "catalog:" as the version in any package.json.
catalog:
  # @convex-dev/better-auth supports better-auth 1.6.x only: keep these three in lockstep.
  "@better-auth/expo": ~1.6.33
  "@convex-dev/better-auth": ^0.12.5
  "@tanstack/query-async-storage-persister": ^5.104.4
  "@tanstack/react-query": ^5.104.4
  "@tanstack/react-query-persist-client": ^5.104.4
  "@types/react": ~19.2.2
  "@types/react-dom": ~19.2.2
  better-auth: ~1.6.33
  convex: ^1.47.0
  react: 19.2.3
  react-dom: 19.2.3
  typescript: ~6.0.3
  vitest: ^5.0.5
  wrangler: ^4.151.1
  zod: ^4.6.7
  zustand: ^5.0.15

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
