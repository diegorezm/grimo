      property="og:description"
      content="Guarde suas leituras, acompanhe o progresso, defina metas, escreva resenhas, leia em grupo e compartilhe o resumo do seu mês. O diário de leituras para quem ama livros."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Canonical, og:url, og:image, JSON-LD, robots.txt and sitemap.xml come from the seo plugin in
         vite.config.ts, which needs VITE_SITE_URL. -->
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        const theme = localStorage.getItem("grimo.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Grimo: o diário das suas leituras</h1>
      <p>
        Guarde suas leituras, acompanhe o progresso, defina metas, escreva resenhas, leia em grupo
        e compartilhe o resumo do seu mês. Ative o JavaScript para usar o Grimo.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
